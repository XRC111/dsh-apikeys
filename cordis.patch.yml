# dsh-apikeys-plugin — API keys for many platforms
#
# One row. It provides:
#   * apikey_call       — call an API on one configured platform with its key
#   * apikey_platforms  — list platforms and accounts, never values
#   * apikey_key        — get / set / clear one account's key
#   * /api/dsh-apikeys  — same-origin bridge used by Settings → API Keys
#                         and 侧栏 插件 → dsh-apikeys-plugin → 配置
#
# Keys are stored in the Host credential store as `dsh-apikeys/<platform>-<account>`
# records. They never appear in this file, in configuration, or in the session log.
#
# Built-in platforms: github, cloudflare, vercel, npm, dockerhub, huggingface.
#
# Config fields (all optional):
#   defaultPlatform: github        platform used when a tool call names none
#   defaultAccount: default        account used when a tool call names none
#   enabledPlatforms: [...]        built-ins to expose; omit for all of them
#   accounts: []                   account names to keep visible before they hold a key
#   customPlatforms: []            your own platforms; see the shape below
#   exposeKeys: true               allow apikey_key get to return a key value
#   envFallback: true              fall back to each platform's environment variable
#   maxResponseChars: 20000        response body cap per call (2000-400000)
#   requestTimeoutMs: 30000        per-request timeout (1000-180000)
#   userAgent: dsh-apikeys         User-Agent header
#   migrateGitHub: true            adopt keys left by the earlier github-only plugin
#
# A custom platform row:
#   customPlatforms:
#     - id: acme                  # lowercase letters and digits, starting with a letter
#       label: Acme API
#       baseUrl: https://api.acme.example/v1
#       envName: ACME_API_KEY     # optional environment fallback
#       docs: https://acme.example/keys
#       verify:                   # optional; without it the page cannot verify
#         path: /me
#         identity: data.login    # dotted path into the JSON body
#       auth:                     # bearer | header | x-api-key | basic | query
#         kind: bearer
#         scheme: Bearer
#       headers: {}               # extra static request headers
- insert:
    - id: apikeys
      name: 'dsh-apikeys-plugin'
      config:
        defaultPlatform: github
        defaultAccount: default
        enabledPlatforms:
          - github
          - cloudflare
          - vercel
          - npm
          - dockerhub
          - huggingface
        customPlatforms: []
        accounts: []
        exposeKeys: true
        envFallback: true
        maxResponseChars: 20000
        requestTimeoutMs: 30000
        userAgent: dsh-apikeys
        # Optional layers. Every default below preserves the behaviour an
        # existing install already has; nothing changes until you opt in.
        vault:
          enabled: false
          file: ''
          passwordEnv: DSH_APIKEYS_MASTER_PASSWORD
          failClosed: true
          migrateCredentials: true
        audit:
          enabled: true
          file: ''
          maxEntries: 2000
        redact:
          enabled: true
          patterns: []
          replaceWith: '[REDACTED]'
        health:
          file: ''
        rotation:
          enabled: false
          retryOn: [401, 403, 429]
          cooldownBaseMs: 5000
          cooldownMaxMs: 300000
          maxAttempts: 3
        upload:
          enabled: true
          roots: []
          maxFileBytes: 26214400
        migrateGitHub: true
